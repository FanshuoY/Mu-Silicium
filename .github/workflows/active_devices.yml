name: Build breeze UEFI
on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build breeze UEFI
        run: bash ./setup_env.sh -p apt && python3 build_uefi.py -d breeze -m 0 -r RELEASE -c
      - name: Upload UEFI images
        uses: actions/upload-artifact@v4
        with:
          name: mu-breeze
          path: ./Mu-*
          if-no-files-found: warn
